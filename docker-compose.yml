services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge-app
    ports:
      - "8501:8501"
    environment:
      - FORGE_OLLAMA_URL=http://ollama:11434
      - FORGE_OUTPUT_ROOT=/app/output_data
      - FORGE_PHARMA_SAFE_MODE=true
      - FORGE_LOG_LEVEL=INFO
      - FORGE_AUDIT_DB=/app/output_data/forge_audit.db
    volumes:
      - app_output:/app/output_data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - forge-net
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge-api
    command: ["python", "-m", "uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "8100:8100"
    environment:
      - FORGE_OLLAMA_URL=http://ollama:11434
      - FORGE_OUTPUT_ROOT=/app/output_data
      - FORGE_PHARMA_SAFE_MODE=true
      - FORGE_LOG_LEVEL=INFO
      - FORGE_AUDIT_DB=/app/output_data/forge_audit.db
    volumes:
      - app_output:/app/output_data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - forge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  ollama:
    image: ollama/ollama:0.6.2
    container_name: forge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    restart: unless-stopped
    networks:
      - forge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "10.0"
    # On Apple Silicon Macs, Ollama runs on CPU inside Docker.
    # For best performance, install Ollama natively to use Metal GPU:
    #   brew install ollama && ollama serve
    # Then set FORGE_OLLAMA_URL=http://host.docker.internal:11434

networks:
  forge-net:
    driver: bridge

volumes:
  ollama_data:
  app_output:
