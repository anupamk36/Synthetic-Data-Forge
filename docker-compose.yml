services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge-api
    ports:
      - "8100:8100"
    environment:
      - FORGE_OLLAMA_URL=http://ollama:11434
      - FORGE_OUTPUT_ROOT=/app/output_data
      - FORGE_PHARMA_SAFE_MODE=true
      - FORGE_LOG_LEVEL=INFO
      - FORGE_AUDIT_DB=/app/output_data/forge_audit.db
      - FORGE_ANTHROPIC_API_KEY=${FORGE_ANTHROPIC_API_KEY:-}
      - FORGE_OPENAI_API_KEY=${FORGE_OPENAI_API_KEY:-}
      - FORGE_GEMINI_API_KEY=${FORGE_GEMINI_API_KEY:-}
      - FORGE_ALCHEMY_API_KEY=${FORGE_ALCHEMY_API_KEY:-}
      - FORGE_ALCHEMY_BASE_URL=${FORGE_ALCHEMY_BASE_URL:-}
      - FORGE_ALCHEMY_USER=${FORGE_ALCHEMY_USER:-ForgeFlow_AI}
      - FORGE_LANGFUSE_PUBLIC_KEY=${FORGE_LANGFUSE_PUBLIC_KEY:-}
      - FORGE_LANGFUSE_SECRET_KEY=${FORGE_LANGFUSE_SECRET_KEY:-}
    volumes:
      - app_output:/app/output_data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - forge-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8100/health', timeout=5).raise_for_status()\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  ollama:
    image: ollama/ollama:0.6.2
    container_name: forge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    restart: unless-stopped
    networks:
      - forge-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "10.0"
    # On Apple Silicon Macs, Ollama runs on CPU inside Docker.
    # For best performance, install Ollama natively to use Metal GPU:
    #   brew install ollama && ollama serve
    # Then set FORGE_OLLAMA_URL=http://host.docker.internal:11434

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8100
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - forge-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

networks:
  forge-net:
    driver: bridge

volumes:
  ollama_data:
  app_output:
